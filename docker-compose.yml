# docker-compose.yml
#
# Purpose: run the gateway, agent, and dashboard together with one
# command, wired with the correct network access and env vars, instead
# of three manual terminal tabs. Postgres itself stays external (the
# real AWS RDS instance provisioned by Terraform) -- this only
# containerizes the application layer, not the database.

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GATEWAY_API_KEYS=${GATEWAY_API_KEYS}
      - GATEWAY_DB_PATH=/app/data/gateway_decisions.db
    volumes:
      - gateway_data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GATEWAY_URL=http://gateway:8010
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8020:8020"
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GATEWAY_DB_PATH=/app/data/gateway_decisions.db
    volumes:
      - gateway_data:/app/data

volumes:
  gateway_data:
